<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18191e"/>
      <stop offset="100%" stop-color="#111215"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea6a28"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea6a28"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 68px; fill: #FFFFFF; letter-spacing: -1.5px; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 21px; fill: #d4d4d8; }
    .badge-text { font-family: 'SF Mono', Monaco, Menlo, 'Courier New', monospace; font-size: 13px; font-weight: 600; fill: #ea6a28; }
  </style>

  <!-- Background Canvas (Thumber dark theme background / card colors) -->
  <rect width="1200" height="420" fill="url(#bannerBg)" rx="16"/>
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="#282a32" stroke-width="1.5"/>

  <!-- Subtle Display Grid Background -->
  <g stroke="#ea6a28" stroke-opacity="0.05" stroke-width="1">
    <path d="M 0 70 H 1200 M 0 140 H 1200 M 0 210 H 1200 M 0 280 H 1200 M 0 350 H 1200"/>
    <path d="M 120 0 V 420 M 240 0 V 420 M 360 0 V 420 M 480 0 V 420 M 600 0 V 420 M 720 0 V 420 M 840 0 V 420 M 960 0 V 420 M 1080 0 V 420"/>
  </g>

  <!-- Ambient Glow Behind Logo -->
  <circle cx="1020" cy="210" r="160" fill="#ea6a28" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Left Content Area -->
  <g transform="translate(90, 95)">
    <!-- Pill Badges -->
    <g transform="translate(0, 0)">
      <rect width="105" height="28" rx="14" fill="#ea6a28" fill-opacity="0.12" stroke="#ea6a28" stroke-opacity="0.35"/>
      <text x="52" y="18.5" text-anchor="middle" class="badge-text">REAL-TIME</text>

      <rect x="115" width="130" height="28" rx="14" fill="#f97316" fill-opacity="0.12" stroke="#f97316" stroke-opacity="0.35"/>
      <text x="180" y="18.5" text-anchor="middle" class="badge-text" fill="#f97316">SELF-HOSTED</text>

      <rect x="255" width="150" height="28" rx="14" fill="#ea6a28" fill-opacity="0.12" stroke="#ea6a28" stroke-opacity="0.35"/>
      <text x="330" y="18.5" text-anchor="middle" class="badge-text" fill="#ea6a28">OPEN SOURCE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="95" class="title">thumber<tspan fill="#ea6a28">.</tspan></text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="150" class="tagline">A fast, modern management UI for RabbitMQ</text>
    <text x="0" y="182" class="tagline" fill="#9ca3af" font-size="18px">All the control of the classic dashboard, plus what it never had.</text>
  </g>

  <!-- Right Graphic: Message flow / topology motif -->
  <g transform="translate(860, 80)">
    <!-- Outer screen frame -->
    <rect x="0" y="0" width="250" height="250" rx="36" fill="#0e0f12" stroke="#334155" stroke-width="2"/>
    <rect x="10" y="10" width="230" height="230" rx="28" fill="none" stroke="url(#accentGlow)" stroke-width="2" opacity="0.4"/>

    <!-- Topology graph: exchange -> bindings -> queues -->
    <g filter="url(#softGlow)">
      <circle cx="60" cy="125" r="16" fill="url(#orangeGrad)"/>
      <line x1="76" y1="118" x2="150" y2="70" stroke="#ea6a28" stroke-width="2" opacity="0.6"/>
      <line x1="76" y1="125" x2="150" y2="125" stroke="#ea6a28" stroke-width="2" opacity="0.6"/>
      <line x1="76" y1="132" x2="150" y2="180" stroke="#ea6a28" stroke-width="2" opacity="0.6"/>

      <rect x="150" y="58" width="42" height="24" rx="6" fill="#1c1d22" stroke="#f97316" stroke-width="1.5"/>
      <rect x="150" y="113" width="42" height="24" rx="6" fill="#1c1d22" stroke="#f97316" stroke-width="1.5"/>
      <rect x="150" y="168" width="42" height="24" rx="6" fill="#1c1d22" stroke="#f97316" stroke-width="1.5"/>
    </g>
    <!-- Live activity dot -->
    <circle cx="222" cy="28" r="5" fill="#10B981" filter="url(#softGlow)"/>
  </g>
</svg>
