<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15161b"/>
      <stop offset="50%" stop-color="#121317"/>
      <stop offset="100%" stop-color="#0d0e12"/>
    </linearGradient>

    <!-- Ambient Orange Radial Glow -->
    <radialGradient id="orangeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea6a28" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#ea6a28" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#121317" stop-opacity="0"/>
    </radialGradient>

    <!-- Secondary Subtle Purple/Blue Glow -->
    <radialGradient id="accentGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#121317" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2029" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#16171e" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Mini Card Background -->
    <linearGradient id="miniCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262833" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1a1b22" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Chart Fill Gradients -->
    <linearGradient id="chartGradientOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea6a28" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ea6a28" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ea6a28" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chartGradientCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="pillShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ea6a28" flood-opacity="0.2"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Canvas Border & Background -->
  <rect width="1200" height="420" fill="url(#bannerBg)" rx="16"/>
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="#262832" stroke-width="1.5"/>

  <!-- Subtle Dot Grid Matrix Pattern -->
  <g fill="#ea6a28" fill-opacity="0.08">
    <circle cx="60" cy="50" r="1.5"/><circle cx="120" cy="50" r="1.5"/><circle cx="180" cy="50" r="1.5"/><circle cx="240" cy="50" r="1.5"/><circle cx="300" cy="50" r="1.5"/><circle cx="360" cy="50" r="1.5"/><circle cx="420" cy="50" r="1.5"/><circle cx="480" cy="50" r="1.5"/><circle cx="540" cy="50" r="1.5"/><circle cx="600" cy="50" r="1.5"/><circle cx="660" cy="50" r="1.5"/><circle cx="720" cy="50" r="1.5"/><circle cx="780" cy="50" r="1.5"/><circle cx="840" cy="50" r="1.5"/><circle cx="900" cy="50" r="1.5"/><circle cx="960" cy="50" r="1.5"/><circle cx="1020" cy="50" r="1.5"/><circle cx="1080" cy="50" r="1.5"/><circle cx="1140" cy="50" r="1.5"/>
    <circle cx="60" cy="110" r="1.5"/><circle cx="120" cy="110" r="1.5"/><circle cx="180" cy="110" r="1.5"/><circle cx="240" cy="110" r="1.5"/><circle cx="300" cy="110" r="1.5"/><circle cx="360" cy="110" r="1.5"/><circle cx="420" cy="110" r="1.5"/><circle cx="480" cy="110" r="1.5"/><circle cx="540" cy="110" r="1.5"/><circle cx="600" cy="110" r="1.5"/><circle cx="660" cy="110" r="1.5"/><circle cx="720" cy="110" r="1.5"/><circle cx="780" cy="110" r="1.5"/><circle cx="840" cy="110" r="1.5"/><circle cx="900" cy="110" r="1.5"/><circle cx="960" cy="110" r="1.5"/><circle cx="1020" cy="110" r="1.5"/><circle cx="1080" cy="110" r="1.5"/><circle cx="1140" cy="110" r="1.5"/>
    <circle cx="60" cy="170" r="1.5"/><circle cx="120" cy="170" r="1.5"/><circle cx="180" cy="170" r="1.5"/><circle cx="240" cy="170" r="1.5"/><circle cx="300" cy="170" r="1.5"/><circle cx="360" cy="170" r="1.5"/><circle cx="420" cy="170" r="1.5"/><circle cx="480" cy="170" r="1.5"/><circle cx="540" cy="170" r="1.5"/><circle cx="600" cy="170" r="1.5"/><circle cx="660" cy="170" r="1.5"/><circle cx="720" cy="170" r="1.5"/><circle cx="780" cy="170" r="1.5"/><circle cx="840" cy="170" r="1.5"/><circle cx="900" cy="170" r="1.5"/><circle cx="960" cy="170" r="1.5"/><circle cx="1020" cy="170" r="1.5"/><circle cx="1080" cy="170" r="1.5"/><circle cx="1140" cy="170" r="1.5"/>
    <circle cx="60" cy="230" r="1.5"/><circle cx="120" cy="230" r="1.5"/><circle cx="180" cy="230" r="1.5"/><circle cx="240" cy="230" r="1.5"/><circle cx="300" cy="230" r="1.5"/><circle cx="360" cy="230" r="1.5"/><circle cx="420" cy="230" r="1.5"/><circle cx="480" cy="230" r="1.5"/><circle cx="540" cy="230" r="1.5"/><circle cx="600" cy="230" r="1.5"/><circle cx="660" cy="230" r="1.5"/><circle cx="720" cy="230" r="1.5"/><circle cx="780" cy="230" r="1.5"/><circle cx="840" cy="230" r="1.5"/><circle cx="900" cy="230" r="1.5"/><circle cx="960" cy="230" r="1.5"/><circle cx="1020" cy="230" r="1.5"/><circle cx="1080" cy="230" r="1.5"/><circle cx="1140" cy="230" r="1.5"/>
    <circle cx="60" cy="290" r="1.5"/><circle cx="120" cy="290" r="1.5"/><circle cx="180" cy="290" r="1.5"/><circle cx="240" cy="290" r="1.5"/><circle cx="300" cy="290" r="1.5"/><circle cx="360" cy="290" r="1.5"/><circle cx="420" cy="290" r="1.5"/><circle cx="480" cy="290" r="1.5"/><circle cx="540" cy="290" r="1.5"/><circle cx="600" cy="290" r="1.5"/><circle cx="660" cy="290" r="1.5"/><circle cx="720" cy="290" r="1.5"/><circle cx="780" cy="290" r="1.5"/><circle cx="840" cy="290" r="1.5"/><circle cx="900" cy="290" r="1.5"/><circle cx="960" cy="290" r="1.5"/><circle cx="1020" cy="290" r="1.5"/><circle cx="1080" cy="290" r="1.5"/><circle cx="1140" cy="290" r="1.5"/>
    <circle cx="60" cy="350" r="1.5"/><circle cx="120" cy="350" r="1.5"/><circle cx="180" cy="350" r="1.5"/><circle cx="240" cy="350" r="1.5"/><circle cx="300" cy="350" r="1.5"/><circle cx="360" cy="350" r="1.5"/><circle cx="420" cy="350" r="1.5"/><circle cx="480" cy="350" r="1.5"/><circle cx="540" cy="350" r="1.5"/><circle cx="600" cy="350" r="1.5"/><circle cx="660" cy="350" r="1.5"/><circle cx="720" cy="350" r="1.5"/><circle cx="780" cy="350" r="1.5"/><circle cx="840" cy="350" r="1.5"/><circle cx="900" cy="350" r="1.5"/><circle cx="960" cy="350" r="1.5"/><circle cx="1020" cy="350" r="1.5"/><circle cx="1080" cy="350" r="1.5"/><circle cx="1140" cy="350" r="1.5"/>
  </g>

  <!-- Ambient Glow Behind Right UI Showcase -->
  <circle cx="890" cy="210" r="240" fill="url(#orangeGlow)"/>
  <circle cx="620" cy="180" r="180" fill="url(#accentGlow)"/>

  <!-- ============================================================ -->
  <!-- LEFT COLUMN: Brand, Typography & Core Capabilities           -->
  <!-- ============================================================ -->
  <g transform="translate(80, 75)">
    <!-- Brand Icon + Category Pill -->
    <g transform="translate(0, 0)">
      <!-- Orange App Icon (Activity heartbeat) -->
      <rect width="44" height="44" rx="12" fill="#ea6a28"/>
      <path d="M 12 22 L 17 22 L 20 13 L 24 31 L 27 22 L 32 22" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Tag Pill -->
      <g transform="translate(56, 7)">
        <rect width="186" height="30" rx="15" fill="#ea6a28" fill-opacity="0.12" stroke="#ea6a28" stroke-opacity="0.35"/>
        <circle cx="16" cy="15" r="4" fill="#ea6a28"/>
        <text x="28" y="19" class="font-mono" font-size="11.5" font-weight="700" fill="#ea6a28" letter-spacing="0.5">RABBITMQ CONSOLE</text>
      </g>
    </g>

    <!-- Brand Name Heading -->
    <text x="0" y="105" class="font-sans" font-weight="800" font-size="64" fill="#ffffff" letter-spacing="-1.8">thumper<tspan fill="#ea6a28">.</tspan></text>

    <!-- Tagline & Description -->
    <text x="0" y="148" class="font-sans" font-weight="600" font-size="20" fill="#f4f4f5">The modern management dashboard for RabbitMQ.</text>
    <text x="0" y="176" class="font-sans" font-weight="400" font-size="15" fill="#a1a1aa">Built directly on the RabbitMQ Management HTTP API — zero extra backend.</text>

    <!-- Value Badges Grid -->
    <g transform="translate(0, 212)">
      <!-- Pill 1: Open Source -->
      <g transform="translate(0, 0)">
        <rect width="122" height="32" rx="8" fill="#1e1f26" stroke="#2e313d" stroke-width="1"/>
        <circle cx="16" cy="16" r="3.5" fill="#22c55e"/>
        <text x="28" y="20.5" class="font-mono" font-size="11" font-weight="600" fill="#d4d4d8">Open Source</text>
      </g>

      <!-- Pill 2: Self-Hosted -->
      <g transform="translate(134, 0)">
        <rect width="120" height="32" rx="8" fill="#1e1f26" stroke="#2e313d" stroke-width="1"/>
        <circle cx="16" cy="16" r="3.5" fill="#06b6d4"/>
        <text x="28" y="20.5" class="font-mono" font-size="11" font-weight="600" fill="#d4d4d8">Self-Hosted</text>
      </g>

      <!-- Pill 3: Zero Backend -->
      <g transform="translate(266, 0)">
        <rect width="130" height="32" rx="8" fill="#1e1f26" stroke="#2e313d" stroke-width="1"/>
        <circle cx="16" cy="16" r="3.5" fill="#ea6a28"/>
        <text x="28" y="20.5" class="font-mono" font-size="11" font-weight="600" fill="#d4d4d8">Zero Backend</text>
      </g>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- RIGHT COLUMN: Sleek Glassmorphic Dashboard Showcase Card     -->
  <!-- ============================================================ -->
  <g transform="translate(630, 48)">
    <!-- Main Floating Glass Window -->
    <rect width="500" height="324" rx="14" fill="url(#cardBg)" stroke="#2c2e3a" stroke-width="1.2" filter="url(#cardShadow)"/>

    <!-- Window Chrome Header -->
    <path d="M 0 14 Q 0 0 14 0 L 486 0 Q 500 0 500 14 L 500 42 L 0 42 Z" fill="#191a21"/>
    <line x1="0" y1="42" x2="500" y2="42" stroke="#282a36" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="20" cy="21" r="5" fill="#ef4444" fill-opacity="0.85"/>
    <circle cx="36" cy="21" r="5" fill="#eab308" fill-opacity="0.85"/>
    <circle cx="52" cy="21" r="5" fill="#22c55e" fill-opacity="0.85"/>

    <!-- Cluster Context in Header -->
    <text x="76" y="25" class="font-mono" font-size="11" font-weight="500" fill="#71717a">rabbit@prod-cluster-01 • v4.3.6</text>

    <!-- Live Status Chip -->
    <g transform="translate(402, 12)">
      <rect width="84" height="20" rx="10" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.3"/>
      <circle cx="10" cy="10" r="3" fill="#22c55e"/>
      <text x="19" y="14" class="font-mono" font-size="9.5" font-weight="700" fill="#22c55e">HEALTHY</text>
    </g>

    <!-- Inside Card: 2 Metric Stat Cards -->
    <g transform="translate(20, 56)">
      <!-- Stat 1: Queued Messages -->
      <g transform="translate(0, 0)">
        <rect width="222" height="64" rx="8" fill="url(#miniCardBg)" stroke="#2d303d" stroke-width="1"/>
        <text x="14" y="24" class="font-mono" font-size="9.5" font-weight="600" fill="#a1a1aa" letter-spacing="0.5">QUEUED MESSAGES</text>
        <text x="14" y="50" class="font-mono" font-size="20" font-weight="800" fill="#ffffff">10,672</text>
        <text x="108" y="49" class="font-mono" font-size="10.5" font-weight="600" fill="#ea6a28">9 in-flight</text>
      </g>

      <!-- Stat 2: Publish Velocity -->
      <g transform="translate(238, 0)">
        <rect width="222" height="64" rx="8" fill="url(#miniCardBg)" stroke="#2d303d" stroke-width="1"/>
        <text x="14" y="24" class="font-mono" font-size="9.5" font-weight="600" fill="#a1a1aa" letter-spacing="0.5">PUBLISH VELOCITY</text>
        <text x="14" y="50" class="font-mono" font-size="20" font-weight="800" fill="#ffffff">81.0 <tspan font-size="13" font-weight="500" fill="#a1a1aa">/s</tspan></text>
        <rect x="145" y="34" width="62" height="18" rx="9" fill="#22c55e" fill-opacity="0.15"/>
        <text x="156" y="46.5" class="font-mono" font-size="9.5" font-weight="700" fill="#22c55e">Normal</text>
      </g>
    </g>

    <!-- Inside Card: Real-Time Wave Chart -->
    <g transform="translate(20, 134)">
      <rect width="460" height="96" rx="8" fill="#16171e" stroke="#252733" stroke-width="1"/>

      <!-- Chart Grid Lines -->
      <line x1="16" y1="32" x2="444" y2="32" stroke="#232530" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="16" y1="64" x2="444" y2="64" stroke="#232530" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Rate 2: Delivery Area (Cyan) -->
      <path d="M 16 84 Q 80 82, 160 62 T 290 52 T 390 56 T 444 45 L 444 90 L 16 90 Z" fill="url(#chartGradientCyan)"/>
      <path d="M 16 84 Q 80 82, 160 62 T 290 52 T 390 56 T 444 45" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>

      <!-- Rate 1: Publish Area (Orange) -->
      <path d="M 16 88 Q 90 86, 170 50 T 290 38 T 390 42 T 444 32 L 444 90 L 16 90 Z" fill="url(#chartGradientOrange)"/>
      <path d="M 16 88 Q 90 86, 170 50 T 290 38 T 390 42 T 444 32" fill="none" stroke="#ea6a28" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Pulse Dot on leading edge -->
      <circle cx="444" cy="32" r="5" fill="#ea6a28"/>
      <circle cx="444" cy="32" r="9" fill="#ea6a28" fill-opacity="0.25"/>

      <!-- Legend Chips in Chart -->
      <g transform="translate(14, 10)">
        <!-- Publish Chip -->
        <g transform="translate(0, 0)">
          <rect width="106" height="20" rx="4" fill="#1b1d26" stroke="#2a2d3b" stroke-width="0.8"/>
          <circle cx="10" cy="10" r="3.5" fill="#ea6a28"/>
          <text x="20" y="13.5" class="font-mono" font-size="9" font-weight="600" fill="#ea6a28">Publish 81.0/s</text>
        </g>

        <!-- Deliver Chip -->
        <g transform="translate(114, 0)">
          <rect width="106" height="20" rx="4" fill="#1b1d26" stroke="#2a2d3b" stroke-width="0.8"/>
          <circle cx="10" cy="10" r="3.5" fill="#06b6d4"/>
          <text x="20" y="13.5" class="font-mono" font-size="9" font-weight="600" fill="#06b6d4">Deliver 77.6/s</text>
        </g>
      </g>
    </g>

    <!-- Inside Card: Visual Topology Pipeline preview -->
    <g transform="translate(20, 244)">
      <rect width="460" height="64" rx="8" fill="#171821" stroke="#252733" stroke-width="1"/>

      <!-- Node 1: Exchange -->
      <g transform="translate(14, 14)">
        <rect width="112" height="36" rx="6" fill="#20222d" stroke="#ea6a28" stroke-width="1.2" stroke-opacity="0.8"/>
        <text x="10" y="18" class="font-mono" font-size="9" font-weight="700" fill="#ea6a28">TOPIC EXCH</text>
        <text x="10" y="29" class="font-mono" font-size="8.5" fill="#a1a1aa">events.orders</text>
      </g>

      <!-- Connection 1 -->
      <path d="M 126 32 L 162 32" fill="none" stroke="#ea6a28" stroke-width="1.5" stroke-dasharray="3,3"/>
      <circle cx="144" cy="32" r="2.5" fill="#ea6a28"/>

      <!-- Node 2: Queue -->
      <g transform="translate(162, 14)">
        <rect width="126" height="36" rx="6" fill="#20222d" stroke="#22c55e" stroke-width="1.2" stroke-opacity="0.8"/>
        <text x="10" y="18" class="font-mono" font-size="9" font-weight="700" fill="#22c55e">QUORUM QUEUE</text>
        <text x="10" y="29" class="font-mono" font-size="8.5" fill="#a1a1aa">orders.processing</text>
      </g>

      <!-- Connection 2 -->
      <path d="M 288 32 L 324 32" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3,3"/>
      <circle cx="306" cy="32" r="2.5" fill="#22c55e"/>

      <!-- Node 3: Consumer -->
      <g transform="translate(324, 14)">
        <rect width="122" height="36" rx="6" fill="#20222d" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.8"/>
        <text x="10" y="18" class="font-mono" font-size="9" font-weight="700" fill="#60a5fa">CONSUMER (1)</text>
        <text x="10" y="29" class="font-mono" font-size="8.5" fill="#a1a1aa">worker-node-04</text>
      </g>
    </g>
  </g>
</svg>
